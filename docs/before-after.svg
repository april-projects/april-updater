<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="PingFang SC,Microsoft YaHei,sans-serif"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5d6575"/></marker></defs><rect width="880" height="340" fill="#0d1017"/><text x="440" y="40" fill="#e6e9f0" font-size="20" font-weight="700" text-anchor="middle">从逐台手点到一次点击</text><rect x="50" y="70" width="370" height="220" rx="12" fill="#161a23" stroke="#262c38"/><text x="235" y="100" fill="#ff5c5c" font-size="14" font-weight="700" text-anchor="middle">以前：每台服务器 5 分钟 × N 台</text><g fill="#8b93a5" font-size="13"><text x="80" y="136">1. ssh 登录服务器</text><text x="80" y="162">2. 手动备份旧 jar</text><text x="80" y="188">3. scp 上传新 jar（几十上百 MB）</text><text x="80" y="214">4. docker restart / 脚本重启</text><text x="80" y="240">5. tail 日志盯到「Started in …」</text></g><text x="235" y="274" fill="#5d6575" font-size="12" text-anchor="middle">传错包 / 忘备份 / 起不来翻历史命令</text><rect x="460" y="70" width="370" height="220" rx="12" fill="rgba(77,124,255,.08)" stroke="#4d7cff"/><text x="645" y="100" fill="#2ecc8f" font-size="14" font-weight="700" text-anchor="middle">现在：页面一次点击</text><g fill="#e6e9f0" font-size="13"><text x="490" y="136">✓ 批量接入：粘贴 IP + 私钥自动扫描</text><text x="490" y="162">✓ 备份 / 上传 / 重启 / 检查全自动</text><text x="490" y="188">✓ 每一步实时可视化</text><text x="490" y="214">✓ 健康检查不过 → 自动回滚旧版本</text><text x="490" y="240">✓ 服务器之间互不影响</text></g><text x="645" y="274" fill="#5d6575" font-size="12" text-anchor="middle">jar 放进目录，点一下，看进度条</text><path d="M424 180h32" stroke="#4d7cff" stroke-width="2" marker-end="url(#b)"/><text x="440" y="170" fill="#9db8ff" font-size="12" text-anchor="middle">1Panel Updater</text></svg>